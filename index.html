<!DOCTYPE html>
<html>

<head>

<title>Mini RPG Battle</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<h1>⚔ MINI RPG BATTLE ⚔</h1>



<div class="battle-field">


<div class="fighter">

<div class="sprite knight">
</div>


<h2>Knight</h2>


<div class="hp-bar">

<div class="hp knight-hp"></div>

</div>


<p>HP 150 / 150</p>


</div>




<div class="vs">

VS

</div>




<div class="fighter">


<div class="sprite goblin">
</div>


<h2>Goblin</h2>


<div class="hp-bar">

<div class="hp goblin-hp"></div>

</div>


<p>HP 120 / 120</p>



</div>



</div>






<div class="battle-ui">


<div class="stats">


<h2>Knight</h2>


<p>LV. 1</p>

<p>⚔ ATK: 25</p>

<p>🛡 DEF: 10</p>

<p>⚡ SPD: 8</p>

<p>🔥 CRIT: 5%</p>


</div>





<div class="actions">


<button>
⚔ Attack
</button>


<button>
🔥 Power Strike
</button>


<button>
🛡 Defend
</button>


<button>
🧪 Potion
</button>


</div>





<div class="stats">


<h2>Goblin</h2>


<p>LV. 1</p>

<p>⚔ ATK: 18</p>

<p>🛡 DEF: 6</p>

<p>⚡ SPD: 6</p>

<p>🔥 CRIT: 2%</p>


</div>



</div>






<div class="log">


⚔ A wild Goblin appeared!


<br>

Knight attacks Goblin!


<br>

💥 Damage: 23



</div>



</div>



</body>

</html>
